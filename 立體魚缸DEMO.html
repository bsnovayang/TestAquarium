<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>立體魚缸 DEMO</title>
<style>
  :root { --bg:#1d2124; --panel:#262b2f; --panel2:#2e3439; --ink:#e8e6e1; --muted:#9aa0a4; --line:#3a4146; --accent:#4fb89f; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#e9e6df; --panel:#fbfaf7; --panel2:#f1eee8; --ink:#2b2b2b; --muted:#6f6f6f; --line:#d8d2c5; --accent:#2f8f78; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .grp { display: flex; gap: 4px; align-items: center; }
  .grp > span { color: var(--muted); margin-right: 2px; }
  button { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 12px; cursor: pointer; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stage { background: #0e1214; border-radius: 10px; padding: 8px; }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; border-radius: 6px; cursor: grab; touch-action: none; }
  #desc { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-top: 10px; }
  #desc b { color: var(--accent); }
  #desc ul { margin: 4px 0; padding-left: 20px; }
  .hide { display: none !important; }
  #err { color: #ff9a7a; }
</style>
</head>
<body>
<main>
  <h1>立體魚缸 DEMO</h1>
  <p class="lead">同一個小魚缸（底沙、石頭、沉木、水草）加一隻孔雀魚，用三種方式做成立體。畫面都是 320×180 的低解析度再放大（像素風）。</p>
  <div class="bar">
    <div class="grp"><button data-mode="A" class="on">A. 2.5D</button><button data-mode="B">B. 像素體素</button><button data-mode="C">C. 3D 引擎＋像素</button></div>
    <div class="grp" id="ctlRot"><button id="auto" class="on">自動轉動</button></div>
    <div class="grp" id="ctlPitch"><span>俯角</span><input id="pitch" type="range" min="0" max="1.2" step=".05" value=".45"></div>
    <span id="err"></span>
  </div>
  <div class="stage"><canvas id="cv" width="320" height="180"></canvas><canvas id="gl" class="hide" width="320" height="180"></canvas></div>
  <div id="desc"></div>
</main>

<script src="js/core.js"></script>
<script src="js/species.js"></script>
<script src="js/voxfish.js"></script>
<script>
'use strict';
(() => {                                                             // 包起來：core.js 已經有全域的 W、H
const W = 320, H = 180, cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const img = ctx.createImageData(W, H), BUF = new Uint32Array(img.data.buffer), ZB = new Float32Array(W * H);
const rgb = h => hex(h), P32 = c => ((255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0]) >>> 0;
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t].map(Math.round);
const rng = seed => { let s = Math.floor(seed * 9973) % 2147483647 || 7; return () => (s = s * 16807 % 2147483647) / 2147483647; };
const h2 = (x, y, s = 0) => { const n = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return n - Math.floor(n); };
function vn(x, y, s) { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy); return lerp(lerp(h2(xi, yi, s), h2(xi + 1, yi, s), u), lerp(h2(xi, yi + 1, s), h2(xi + 1, yi + 1, s), u), v); }
const WATER = rgb('#4c9cbc'), WATER_DK = rgb('#2c6a8c'), SAND = ['#e2cfa4', '#d0b98c', '#b89e72', '#9a8258'].map(rgb), STONE = ['#cfd4d5', '#a9afb1', '#868d90', '#666d70', '#4a5053'].map(rgb);
const MOSS = ['#9cc46a', '#6e9c48', '#4c7a34'].map(rgb), WOOD = ['#b8946a', '#8e6a44', '#6a4a2c', '#4a3220'].map(rgb), LEAF = ['#9cd870', '#6cb658', '#4a9448', '#2e6c36'].map(rgb);
const LIGHTW = (() => { const v = [-.4, .8, .45], l = Math.hypot(...v); return v.map(c => c / l); })();
const BY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const tone = (ramp, d, x, y, off = 0) => ramp[clamp(Math.floor((1 - d) * (ramp.length - .5) + off + (BY[(y & 3) * 4 + (x & 3)] - .5) * .45), 0, ramp.length - 1)];
let mode = 'A', auto = true, pitch = .45, yaw = .6, mouse = { x: 0, y: 0 }, cam = { x: 0, y: 0 };
const FISH_LEN = 110;                                                // voxfish 的魚全長（局部單位）

// 拖曳轉動（B、C）／滑鼠位置（A）
let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, yaw }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(); mouse.x = ((e.clientX - r.left) / r.width - .5) * 2; mouse.y = ((e.clientY - r.top) / r.height - .5) * 2;
  if (drag && mode !== 'A') { yaw = drag.yaw + (e.clientX - drag.x) * .01; auto = false; document.getElementById('auto').classList.remove('on'); }
});
cv.addEventListener('pointerup', () => drag = null);
cv.addEventListener('pointerleave', () => { if (mode === 'A') { mouse.x = 0; mouse.y = 0; } });
document.getElementById('auto').onclick = e => { auto = !auto; e.target.classList.toggle('on', auto); };
document.getElementById('pitch').oninput = e => { pitch = +e.target.value; };

// 效能：魚的立體資料依「密度＋游泳姿勢（16 格）」快取，不要每幀重算（每幀重算會產生上千個物件，垃圾回收會卡頓）
const VCACHE = new Map();
function fishVox(dens, phase) {
  const d = Math.round(dens * 20) / 20, k = ((Math.floor(phase / (Math.PI * 2) * 16) % 16) + 16) % 16, key = d + ':' + k;
  let V = VCACHE.get(key);
  if (!V) { V = buildVoxels('guppy', k / 16 * Math.PI * 2, .5, d); VCACHE.set(key, V); if (VCACHE.size > 96) VCACHE.delete(VCACHE.keys().next().value); }
  return V;
}
// 魚的游動路線（三個 DEMO 共用）：在缸裡前後左右繞，回傳位置與朝向
function fishPath(t, X, Y, Z) {
  const p = (tt) => [X[0] + X[1] * Math.sin(tt * .32), Y[0] + Y[1] * Math.sin(tt * .5), Z[0] + Z[1] * Math.sin(tt * .21 + 1.2)];
  const a = p(t), b = p(t + .05), yawF = Math.atan2(b[2] - a[2], b[0] - a[0]);
  return { x: a[0], y: a[1], z: a[2], yaw: yawF };
}
// 把一隻 voxfish 畫進緩衝區：proj(x,y,z) → [X, Y, depth, 每格幾像素]；深度大 = 近
function splatFish(V, f, scale, proj, fog) {
  const c = Math.cos(f.yaw), s = Math.sin(f.yaw);
  for (const v of V.vox) {
    // 魚的局部（ix 頭尾、iy 上下、iz 左右）→ 世界：頭朝 yaw 方向（x-z 平面）
    const lx = v.ix * scale, ly = v.iy * scale, lz = v.iz * scale;
    const wx = f.x + lx * c - lz * s, wz = f.z + lx * s + lz * c, wy = f.y + ly;
    const pr = proj(wx, wy, wz); if (!pr) continue;
    const n = [v.n[0] * c - v.n[2] * s, v.n[1], v.n[0] * s + v.n[2] * c];
    let col = shadeColor(v, n, pr[0] | 0, pr[1] | 0);
    if (fog) col = mix3(col, WATER, fog(wz));
    plot(pr[0], pr[1], pr[2], pr[3], P32(col));
  }
}
let MASK = null;                                                      // 不是 null 時，plot 會順便標記「物件」的格子（給外框用）
function plot(X, Y, depth, size, c) {                                // 方塊點（z 緩衝）
  const sz = Math.max(1, Math.ceil(size)), x0 = Math.round(X - sz / 2), y0 = Math.round(Y - sz / 2);
  for (let yy = y0; yy < y0 + sz; yy++) for (let xx = x0; xx < x0 + sz; xx++) {
    if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
    const i = yy * W + xx; if (depth > ZB[i]) { ZB[i] = depth; BUF[i] = c; if (MASK) MASK[i] = 1; }
  }
}
function outlineBuf(mask) {                                          // 只對「物件」加外框（mask 1 的格子）
  const src = BUF.slice();
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x; if (mask[i]) continue;
    for (const j of [i - 1, i + 1, i - W, i + W]) if (mask[j]) { const v = src[j]; BUF[i] = ((255 << 24) | ((((v >> 16) & 255) * .4) << 16) | ((((v >> 8) & 255) * .4) << 8) | ((v & 255) * .4)) >>> 0; break; }
  }
}

// =====================================================================
// A. 2.5D：透視的玻璃盒＋放在不同深度的平面（石頭、水草）＋立體的魚
// 世界：x -80..80、y -48..48（上為正）、z 0（前玻璃）..60（後）
// =====================================================================
const A = { D: 170, f: 300 / 160 * 170 };
function projA(x, y, z) { const s = A.f / (z + A.D); return [160 + (x - cam.x) * s, 90 - (y - cam.y) * s, -z, s]; }
// 平面物件：在局部格子上定義「形狀函式」，每幀依透視大小重新點陣化（不會模糊）
// 形狀函式：結果放在 SH_C（色階）、SH_D（亮度），回傳 true／false（不要每個像素都 new 一個物件，垃圾回收會卡）
let SH_C = null, SH_D = 0;
function shapeRock(u, v) {                                           // u -1..1、v 0..1（下到上）
  if (Math.abs(u) >= 1) return false;
  const top = Math.pow(1 - u * u, .55) * (1 + (vn(u * 4, 0, 3) - .5) * .25);
  if (v > top) return false;
  if (v > top - .08 && vn(u * 5, 1, 9) > .45) { SH_C = MOSS; SH_D = .8; return true; }
  SH_C = STONE; SH_D = clamp((v / top) * .6 + (u + 1) * .25 + (vn(u * 6, v * 6, 4) - .5) * .5, 0, 1); return true;
}
function shapePlant(u, v, t, seed) {                                 // 幾根莖，往上擺動
  for (let k = 0; k < 4; k++) {
    const h = .75 + .25 * Math.sin(seed + k * 2.1);
    if (v > h) continue;
    const x0 = (k - 1.5) * .28 + Math.sin(t * 1.3 + k + seed) * .25 * v + Math.sin(v * 5 + k) * .06, du = u - x0;
    if (Math.abs(du) < .045) { SH_C = LEAF; SH_D = .35 + (k % 2) * .2; return true; }
    const node = Math.round(v * 12), side = node % 2 ? 1 : -1;
    if (Math.abs(v - node / 12) < .03 && du * side > 0 && Math.abs(du) < .22 * (1 - v * .4)) { SH_C = LEAF; SH_D = du * side < .1 ? .85 : .6; return true; }
  }
  return false;
}
const A_OBJ = [
  { kind: 'plant', x: 34, z: 50, w: 46, h: 70, seed: 1 },
  { kind: 'rock', x: -32, z: 40, w: 58, h: 34 },
  { kind: 'wood', x: 18, z: 28 },
  { kind: 'plant', x: -58, z: 16, w: 40, h: 62, seed: 4 },
  { kind: 'plant', x: 66, z: 4, w: 30, h: 52, seed: 7, front: true },
];
function drawA(t) {
  cam.x = lerp(cam.x, mouse.x * 34, .08); cam.y = lerp(cam.y, -mouse.y * 18, .08);
  const fogA = z => .08 + z / 60 * .42;
  const bgKey = Math.round(cam.x * 4) + ',' + Math.round(cam.y * 4);
  if (A.bgKey === bgKey) { BUF.set(A.bg); ZB.set(A.bz); }              // 視角沒變：直接用上次的背景
  else {
  BUF.fill(P32(rgb('#0e1214'))); ZB.fill(-1e9);
  // 背景：後玻璃上的岩壁＋水（逐像素反推）
  for (let Y = 0; Y < H; Y++) for (let X = 0; X < W; X++) {
    // 後面 z = 60 的平面
    const s = A.f / (60 + A.D), x = cam.x + (X - 160) / s, y = cam.y + (90 - Y) / s;
    if (x < -80 || x > 80 || y < -48 || y > 48) continue;
    const wall = y < -10 + Math.sin(x * .07) * 14 + Math.sin(x * .19) * 6;
    const c = y > 36 ? rgb('#dfe9e4') : wall ? mix3(STONE[3], WATER_DK, .55) : mix3(WATER, WATER_DK, (36 - y) / 84);
    BUF[Y * W + X] = P32(c); ZB[Y * W + X] = -60;
  }
  // 底沙：y = -40 的地板（從後往前）
  for (let Y = 0; Y < H; Y++) {
    const dy = 90 - Y; if (Math.abs(dy) < .01) continue;
    const z = (-40 - cam.y) * A.f / dy - A.D; if (z < 0 || z > 60) continue;
    for (let X = 0; X < W; X++) {
      const x = cam.x + (X - 160) * (z + A.D) / A.f; if (x < -80 || x > 80) continue;
      const g = h2(Math.floor(x * 1.5), Math.floor(z * 1.5), 2), c = SAND[clamp(Math.floor(z / 22 + (g < .12 ? 1 : 0) + BY[(Y & 3) * 4 + (X & 3)] * .6), 0, 3)];
      BUF[Y * W + X] = P32(mix3(c, WATER, fogA(z) * .7)); ZB[Y * W + X] = -z;
    }
  }
  A.bg = BUF.slice(); A.bz = ZB.slice(); A.bgKey = bgKey;
  }
  // 物件與魚：依深度從後往前畫
  const f = fishPath(t, [0, 52], [2, 10], [30, 24]);
  const items = A_OBJ.map(o => ({ z: o.z, o })).concat([{ z: f.z, fish: f }]).sort((a, b) => b.z - a.z);
  const mask = new Uint8Array(W * H);
  for (const it of items) {
    if (it.fish) {                                                    // 立體的魚：每格依透視大小
      const s = A.f / (f.z + A.D), V = fishVox(clamp(s * 30 / FISH_LEN, .12, 1.2), t * 9), scale = 1 / (Math.round(clamp(s * 30 / FISH_LEN, .12, 1.2) * 20) / 20) * 30 / FISH_LEN;
      MASK = mask; splatFish(V, f, scale, projA, z => fogA(z) * .6); MASK = null;
      continue;
    }
    const o = it.o, s = A.f / (o.z + A.D);
    if (o.kind === 'wood') {                                          // 沉木：斜的長條
      const a = [o.x - 30, -40, o.z], b = [o.x + 26, -8, o.z], pa = projA(...a), pb = projA(...b), r = 3.2 * s;
      const len = Math.hypot(pb[0] - pa[0], pb[1] - pa[1]), nx = -(pb[1] - pa[1]) / len, ny = (pb[0] - pa[0]) / len;
      for (let k = 0; k <= len; k += .5) for (let w = -r; w <= r; w += .5) {
        const X = Math.round(pa[0] + (pb[0] - pa[0]) * k / len + nx * w), Y = Math.round(pa[1] + (pb[1] - pa[1]) * k / len + ny * w);
        if (X < 0 || Y < 0 || X >= W || Y >= H) continue;
        const c = WOOD[clamp(Math.floor((w / r + 1) * 1.6 + (Math.sin(k * .6) > .8 ? 1 : 0)), 0, 3)];
        BUF[Y * W + X] = P32(mix3(c, WATER, fogA(o.z))); mask[Y * W + X] = 1;
      }
      continue;
    }
    const base = projA(o.x, -40, o.z), pw = o.w * s, ph = o.h * s;
    if (o.kind === 'rock' && o.cacheKey === bgKey) {                     // 石頭不會動：視角沒變就貼上次的結果
      for (let k = 0; k < o.cache.length; k += 2) { BUF[o.cache[k]] = o.cache[k + 1]; mask[o.cache[k]] = 1; }
      continue;
    }
    const rec = o.kind === 'rock' ? [] : null;
    for (let Y = Math.floor(base[1] - ph); Y <= Math.ceil(base[1]); Y++) for (let X = Math.floor(base[0] - pw / 2); X <= Math.ceil(base[0] + pw / 2); X++) {
      if (X < 0 || Y < 0 || X >= W || Y >= H) continue;
      const u = (X - base[0]) / (pw / 2), v = (base[1] - Y) / ph;
      if (!(o.kind === 'rock' ? shapeRock(u, v) : shapePlant(u, v, t, o.seed))) continue;
      let c = tone(SH_C, SH_D, X, Y);
      if (o.front) c = mix3(c, rgb('#16302a'), .55);                   // 前景：暗的剪影
      else c = mix3(c, WATER, fogA(o.z));
      BUF[Y * W + X] = P32(c); mask[Y * W + X] = 1;
      if (rec) rec.push(Y * W + X, BUF[Y * W + X]);
    }
    if (rec) { o.cache = rec; o.cacheKey = bgKey; }
  }
  outlineBuf(mask);
  // 水面（y = 38）：半透明，前緣一條亮線
  for (let Y = 0; Y < H; Y++) {
    const dy = 90 - Y; if (Math.abs(dy) < .01) continue;
    const z = (38 - cam.y) * A.f / dy - A.D; if (z < 0 || z > 60) continue;
    for (let X = 0; X < W; X++) {
      const x = cam.x + (X - 160) * (z + A.D) / A.f; if (x < -80 || x > 80) continue;
      const i = Y * W + X, v = BUF[i], c = [v & 255, (v >> 8) & 255, (v >> 16) & 255];
      BUF[i] = P32(mix3(c, rgb('#cfeaf2'), .55 + (Math.sin(x * .3 + t * 2 + z * .2) > .8 ? .2 : 0)));
    }
  }
  // 玻璃盒的邊
  const C8 = [[-80, -48, 0], [80, -48, 0], [80, 48, 0], [-80, 48, 0], [-80, -48, 60], [80, -48, 60], [80, 48, 60], [-80, 48, 60]].map(p => projA(...p));
  const E = [[4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7], [0, 1], [1, 2], [2, 3], [3, 0]];
  E.forEach(([a, b], k) => line(C8[a], C8[b], k < 8 ? P32(rgb('#7f9ea8')) : P32(rgb('#d8f0f4'))));
  ctx.putImageData(img, 0, 0);
}
function line(a, b, c) { const n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1])); for (let i = 0; i <= n; i++) { const X = Math.round(a[0] + (b[0] - a[0]) * i / n), Y = Math.round(a[1] + (b[1] - a[1]) * i / n); if (X >= 0 && Y >= 0 && X < W && Y < H) BUF[Y * W + X] = c; } }

// =====================================================================
// B. 像素體素魚缸：整個缸是一格一格的方塊，可以繞著轉
// 格子：X 96、Y 60（上）、Z 48；水面 y = 46
// =====================================================================
const B = { X: 96, Y: 60, Z: 48, water: 46, vox: null };
function buildTankVoxels() {
  const { X, Y, Z } = B, map = new Map(), key = (x, y, z) => (x * 64 + y) * 64 + z;
  const put = (x, y, z, c, d = 0) => { if (x >= 0 && y >= 0 && z >= 0 && x < X && y < Y && z < Z) map.set(key(x, y, z), { x, y, z, c, d }); };
  const sandH = (x, z) => 4 + Math.round(vn(x * .12, z * .12, 1) * 3);
  for (let x = 0; x < X; x++) for (let z = 0; z < Z; z++) { const hh = sandH(x, z); for (let y = 0; y < hh; y++) put(x, y, z, SAND, (h2(x, z * 7 + y, 3) < .15 ? .3 : 0) + y / hh * .2); }
  for (const r of [{ x: 30, z: 30, rx: 15, ry: 12, rz: 11 }, { x: 74, z: 13, rx: 8, ry: 6, rz: 7 }]) {   // 石頭
    const by = sandH(r.x, r.z) - 2;
    for (let x = r.x - r.rx - 2; x <= r.x + r.rx + 2; x++) for (let y = by; y <= by + r.ry * 2; y++) for (let z = r.z - r.rz - 2; z <= r.z + r.rz + 2; z++) {
      const e = ((x - r.x) / r.rx) ** 2 + ((y - by) / r.ry) ** 2 + ((z - r.z) / r.rz) ** 2 + (vn(x * .2, y * .2 + z * .13, 5) - .5) * .5;
      if (e <= 1 && y >= by) put(x, y, z, y > by + r.ry * .9 && vn(x * .3, z * .3, 9) > .5 ? MOSS : STONE, vn(x * .3, y * .3 + z, 6) * .5);
    }
  }
  const a = [48, 7, 38], b = [88, 30, 16], R = 2.6;                     // 沉木（斜的圓柱）

function drawB(t) {
