<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>半水陸生態缸 雛形</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="palette"></aside>

  <main id="stageWrap">
    <canvas id="cv"></canvas>
    <button id="toEdit" class="floating">✎ 編輯模式</button>
    <button id="sideToggle" aria-controls="side" aria-expanded="false">ℹ 資訊</button>
    <div id="balance" hidden>
      <div class="balhead"><b>平衡調整</b><small>改了立刻生效，並記在這個瀏覽器</small>
        <span><button id="balExport">匯出</button><button id="balImport">匯入</button><button id="balReset">重設預設</button><button id="balClose">✕</button></span></div>
      <div id="balBody"></div>
      <input id="balFile" type="file" accept=".json,application/json" hidden>
    </div>
  </main>

  <aside id="side">
    <section><h3>選取</h3><div id="selPanel"></div></section>
    <section><h3>水質</h3><div id="waterPanel"></div>
      <div class="btns"><button id="wChange" title="髒污減少約三分之一">🪣 換水 30%</button><button id="wScrub" title="藻類減半">🧽 刷藻</button></div></section>
    <section><h3>族群 <small id="clock">0:00</small></h3><div id="popPanel"></div></section>
    <section><h3>族群變化</h3>
      <div class="legend"><span><i style="background:var(--series-1)"></i>魚</span><span><i style="background:var(--series-2)"></i>蚊子</span><span><i style="background:var(--series-3)"></i>孑孓（含蛹、卵）</span></div>
      <div class="chartBox"><canvas id="chart"></canvas><div id="chartTip"></div></div></section>
    <section><h3>事件</h3><div id="eventPanel"></div></section>
    <section><h3>成就 <small id="achCount"></small></h3><details id="achBox"><summary>查看全部</summary><div id="achPanel"></div></details></section>
    <section><h3>設定</h3><div id="setPanel"></div></section>
  </aside>

  <footer id="bar">
    <div class="grp"><span>魚缸</span><select id="tank"></select></div>
    <div class="grp"><span>鏡頭</span><button id="zoomOut">－</button><button id="zoomFit">全景</button><button id="zoomIn">＋</button></div>
    <div class="grp"><span>水位</span><input id="water" type="range" min="0" max="100" value="55"><b id="waterVal">55%</b></div>
    <div class="grp"><span>速度</span>
      <button data-speed="0">⏸</button><button data-speed="1" class="on">1x</button><button data-speed="2">2x</button>
      <button data-speed="5">5x</button><button data-speed="10">10x</button></div>
    <div class="grp"><button id="undo" title="復原（Ctrl+Z）">↶ 復原</button><button id="redo" title="重做（Ctrl+Y）">↷ 重做</button></div>
    <div class="grp"><button id="feed">🍤 餵食</button></div>
    <div class="grp">
      <button id="save">存檔</button><button id="load">讀檔</button>
      <button id="export">匯出</button><button id="import">匯入</button>
      <button id="newTank" class="primary">＋ 新魚缸</button><button id="clear">清空</button></div>
    <div class="grp"><button id="openBal">⚙ 平衡</button><button id="help" title="新手說明">？ 說明</button></div>
    <div class="grp right"><button id="toView" class="primary">▶ 觀賞模式</button></div>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </footer>
</div>
<div id="presetModal" hidden>
  <div class="pmBox">
    <div class="pmHead"><b>選擇魚缸配置</b><small>目前的魚缸會被取代（可以按「復原」救回來）</small><button id="pmClose">✕</button></div>
    <div id="pmGrid"></div>
  </div>
</div>
<div id="toast"></div>
<div id="achPop" role="status" aria-live="polite"></div>
<div id="rotateHint"><div>📱↻<br>請將裝置轉為橫向</div></div>

<script src="js/core.js"></script>
<script src="js/species.js"></script>
<script src="js/world.js"></script>
<script src="js/effects.js"></script>
<script src="js/water.js"></script>
<script src="js/creatures.js"></script>
<script src="js/draw.js"></script>
<script src="js/presets.js"></script>
<script src="js/ui.js"></script>
<script src="js/balance.js"></script>
<script src="js/achievements.js"></script>
<script src="js/main.js"></script>
<script src="js/tutorial.js"></script>
</body>
</html>
