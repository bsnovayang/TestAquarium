<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>像素測試版</title>
<style>
  :root { --bg:#15181a; --panel:#262b2f; --panel2:#2e3439; --ink:#e8e6e1; --muted:#9aa0a4; --line:#3a4146; --accent:#4fb89f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif; }
  #app { height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header b { font-size: 15px; }
  .grp { display: flex; gap: 4px; align-items: center; }
  .grp > span { color: var(--muted); }
  button { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; cursor: pointer; touch-action: manipulation; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  a { color: var(--accent); }
  #info { color: var(--muted); font-size: 12px; margin-left: auto; }
  #stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #px { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: grab; }
  #hint { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--muted); background: rgba(0,0,0,.5); padding: 2px 10px; border-radius: 10px; pointer-events: none; }
  @media (max-height: 520px) { header { padding: 3px 8px; gap: 4px 10px; } header b { display: none; } #info { display: none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <b>像素測試版</b>
    <div class="grp"><span>魚缸</span><button data-preset="planted" class="on">水草缸</button><button data-preset="kingfisher">溪邊翠鳥缸</button></div>
    <div class="grp"><span>鏡頭</span><button data-z="1" class="on">1x</button><button data-z="2">2x</button><button data-z="4">4x</button></div>
    <div class="grp"><span>速度</span><button data-speed="0">⏸</button><button data-speed="1" class="on">1x</button><button data-speed="2">2x</button><button data-speed="5">5x</button><button data-speed="10">10x</button></div>
    <div class="grp"><button id="feed">🍤 餵食</button><button id="night">🌙 日夜快轉</button></div>
    <div class="grp"><span>比例</span><button data-cs="1" class="on">1x</button><button data-cs="1.5">1.5x</button><button data-cs="2">2x</button></div>
    <div class="grp"><span>燈光</span><button data-light="day" class="on">明亮</button><button data-light="aqua">藍光</button><button data-light="glow">夜光</button></div>
    <div class="grp"><button data-opt="mute">背景淡化</button><button data-opt="bright">亮色細線</button><button data-opt="hybrid">混合光影</button><button data-opt="detail" class="on" title="依格子數加細節、自動清理（關掉 = 改善前）">細節</button></div>
    <div class="grp"><a href="index.html">回正式版</a></div>
    <span id="info"></span>
  </header>
  <main id="stage"><canvas id="px" width="640" height="360"></canvas><div id="hint">點一下餵食・拖曳移動・滾輪縮放</div></main>
</div>

<script src="js/core.js"></script>
<script src="js/species.js"></script>
<script src="js/world.js"></script>
<script src="js/effects.js"></script>
<script src="js/water.js"></script>
<script src="js/creatures.js"></script>
<script src="js/draw.js"></script>
<script src="js/presets.js"></script>
<script src="js/pixel.js"></script>
<script>
'use strict';
const cv = document.getElementById('px'), ctx = cv.getContext('2d');
let speed = 1, scale = 1;
// 換魚缸時重新產生背景、底沙（main.js 沒載入，所以在這裡定義）
function onTankResize() { SAND = makeSand(); ALGAE_SPOTS = makeAlgaeSpots(); SCENERY = makeScenery(); }
updateWaterY();
loadPreset('planted');

// 畫布：整數倍放大（用實際像素算，手機高解析螢幕也是整數倍）
function fit() {
  const st = document.getElementById('stage').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  scale = Math.max(1, Math.floor(Math.min(st.width * dpr / PXW, st.height * dpr / PXH)));
  cv.width = PXW * scale; cv.height = PXH * scale;                     // 畫布用實際像素（混合光影要平滑）
  cv.style.width = PXW * scale / dpr + 'px'; cv.style.height = PXH * scale / dpr + 'px';
}
window.addEventListener('resize', fit); new ResizeObserver(fit).observe(document.getElementById('stage')); fit();

// 鏡頭
function camClampPx() {
  const vw = PXW / ppu(), vh = PXH / ppu();
  PXCAM.x = clamp(PXCAM.x, 0, Math.max(0, W - vw)); PXCAM.y = clamp(PXCAM.y, 0, Math.max(0, H - vh));
}
function setZoom(z, ax = PXW / 2, ay = PXH / 2) {                     // ax, ay：以畫面上哪一格為中心縮放
  const wx = PXCAM.x + ax / ppu(), wy = PXCAM.y + ay / ppu();
  PXCAM.z = z; PXCAM.x = wx - ax / ppu(); PXCAM.y = wy - ay / ppu(); camClampPx();
  document.querySelectorAll('[data-z]').forEach(b => b.classList.toggle('on', +b.dataset.z === z));
}
document.querySelectorAll('[data-z]').forEach(b => b.onclick = () => setZoom(+b.dataset.z));
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => { speed = +b.dataset.speed; document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x === b)); });
document.getElementById('feed').onclick = () => { for (let i = 0; i < 4; i++) dropFood(PXCAM.x + PXW / ppu() * (.3 + Math.random() * .4), 3); };
document.getElementById('night').onclick = e => {                     // 日夜快轉：4 分鐘一天，方便看夜晚的樣子
  const on = world.settings.dayCycle !== 'fast'; world.settings.dayCycle = on ? 'fast' : 'off'; e.target.classList.toggle('on', on);
};

// 換魚缸（寬缸在全景時比畫面寬，可以拖曳左右看）
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
  loadPreset(b.dataset.preset); PXCAM.x = 0; PXCAM.y = 0; camClampPx();
  document.querySelectorAll('[data-preset]').forEach(x => x.classList.toggle('on', x === b));
});
// 畫面選項
function syncOpt() {
  document.querySelectorAll('[data-cs]').forEach(b => b.classList.toggle('on', +b.dataset.cs === PXOPT.cscale));
  document.querySelectorAll('[data-light]').forEach(b => b.classList.toggle('on', b.dataset.light === PXOPT.light));
  document.querySelectorAll('[data-opt]').forEach(b => b.classList.toggle('on', !!PXOPT[b.dataset.opt]));
}
document.querySelectorAll('[data-cs]').forEach(b => b.onclick = () => { PXOPT.cscale = +b.dataset.cs; syncOpt(); });
document.querySelectorAll('[data-light]').forEach(b => b.onclick = () => { PXOPT.light = b.dataset.light; syncOpt(); });
document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { PXOPT[b.dataset.opt] = !PXOPT[b.dataset.opt]; syncOpt(); });

// 畫面操作：拖曳移動、點一下餵食、滾輪縮放
const toPx = ev => { const r = cv.getBoundingClientRect(); return P((ev.clientX - r.left) / r.width * PXW, (ev.clientY - r.top) / r.height * PXH); };
let drag = null;
cv.addEventListener('pointerdown', ev => { cv.setPointerCapture(ev.pointerId); drag = { p: toPx(ev), cx: PXCAM.x, cy: PXCAM.y, moved: false }; cv.style.cursor = 'grabbing'; });
cv.addEventListener('pointermove', ev => {
  if (!drag) return; const p = toPx(ev), dx = p.x - drag.p.x, dy = p.y - drag.p.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  PXCAM.x = drag.cx - dx / ppu(); PXCAM.y = drag.cy - dy / ppu(); camClampPx();
});
cv.addEventListener('pointerup', ev => {
  if (drag && !drag.moved) { const p = toPx(ev); dropFood(PXCAM.x + p.x / ppu(), 3); }
  drag = null; cv.style.cursor = 'grab';
});
cv.addEventListener('wheel', ev => { ev.preventDefault(); const p = toPx(ev), zs = [1, 2, 4], i = zs.indexOf(PXCAM.z); setZoom(zs[clamp(i + (ev.deltaY < 0 ? 1 : -1), 0, 2)], p.x, p.y); }, { passive: false });

// 測試用網址參數：?z=4&focus=cherry&tod=0.9（鏡頭、對準某種生物、時間）
{ const q = new URLSearchParams(location.search);
  if (q.has('preset')) document.querySelector(`[data-preset="${q.get('preset')}"]`)?.click();
  if (q.has('tod')) { world.tod = +q.get('tod'); world.settings.dayCycle = 'normal'; }
  if (q.has('z')) { setZoom(+q.get('z')); const f = q.get('focus') && world.ents.find(e => e.type === q.get('focus'));
    if (f) { PXCAM.x = f.x - PXW / ppu() / 2; PXCAM.y = f.y - PXH / ppu() * .6; camClampPx(); }
    if (q.has('fx')) { PXCAM.x = +q.get('fx') - PXW / ppu() / 2; PXCAM.y = +q.get('fy') - PXH / ppu() / 2; camClampPx(); } }
  if (q.has('cs')) PXOPT.cscale = +q.get('cs');
  if (q.has('light')) PXOPT.light = q.get('light');
  for (const k of ['mute', 'bright', 'hybrid']) if (q.has(k)) PXOPT[k] = true;
  if (q.has('nodetail')) PXOPT.detail = false;
  syncOpt();
  if (q.has('warm')) for (let i = 0; i < +q.get('warm') * 60; i++) step(STEP);
  if (q.has('dive')) { const b = world.ents.find(e => e.kind === 'bird'); if (b) { b.hunger = 40; b.cool = 0; for (let i = 0; i < 60 * 240 && !(b.mode === 'under' && b.modeT > .08); i++) step(STEP); speed = 0;
    document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x.dataset.speed === '0')); setZoom(+(q.get('z') || 2)); PXCAM.x = b.bk.x - PXW / ppu() / 2; PXCAM.y = world.waterY - PXH / ppu() * .55; camClampPx(); } } }

// 主迴圈
let acc = 0, last = performance.now(), fpsN = 0, fpsT = 0, drawMs = 0;
function frame(now) {
  const real = Math.min(.1, (now - last) / 1000); last = now;
  if (!document.hidden && speed > 0) { acc += real * speed; let n = 0; while (acc >= STEP && n < 30) { step(STEP); acc -= STEP; n++; } if (n >= 30) acc = 0; }
  const t0 = performance.now();
  renderPixel(); presentPixel(ctx, scale);
  drawMs += performance.now() - t0; fpsN++;
  if (now - fpsT > 1000) { document.getElementById('info').textContent = `${Math.round(fpsN * 1000 / (now - fpsT))} FPS・繪圖 ${(drawMs / fpsN).toFixed(1)} ms・畫面 640×360 × ${scale} 倍・${todText ? todText() : ''}`; fpsN = 0; drawMs = 0; fpsT = now; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
